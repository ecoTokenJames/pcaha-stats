name: Daily scrape

# Pulls fresh standings + the day's games from Spordle and commits them to main.
# The push to main triggers Vercel to rebuild and redeploy the site.
on:
  schedule:
    # Twice a day, when families check, and each run only asks Spordle for new games
    # (see data/cache). Kept minimal on purpose: Spordle's firewall blocked us for two
    # days (2026-10-24 to 10-26) after a run of heavy scraping.
    # Cron is UTC. B.C. is on permanent Pacific Time (UTC-7) since Nov 2026, so these
    # don't shift with the seasons. Evening runs land on the next UTC day.
    # Weekdays: games are 5-9pm, so 8pm and midnight.
    - cron: "0 3 * * 2-6" # Mon-Fri 8pm PT
    - cron: "0 7 * * 2-6" # Mon-Fri midnight PT
    # Weekends: games run all day, so an afternoon run puts morning games up by 4pm.
    - cron: "0 23 * * 6,0" # Sat-Sun 4pm PT
    - cron: "0 5 * * 0,1" # Sat-Sun 10pm PT
  workflow_dispatch:
    inputs:
      season:
        description: "Season override, e.g. 2026-27 (blank = auto)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Scraper only uses Node built-ins + fetch, so no npm install needed.

      - name: Scrape
        env:
          PCAHA_SEASON: ${{ inputs.season }}
        run: |
          # Start clean so last season's per-division files don't linger. data/cache stays:
          # it holds the game sheets and rosters already read, so only new games are fetched
          rm -rf data/standings data/players data/games data/gamelogs
          node scraper/scrape.js

      - name: Sanity check
        run: |
          node -e "
            const s = require('./data/standings/all-standings.json');
            const n = Object.keys(s).length;
            console.log('schedules with standings:', n);
            if (n === 0) { console.error('No standings scraped — refusing to commit'); process.exit(1); }
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/standings data/players data/games data/gamelogs; then
            echo "No stat changes — skipping commit"
            exit 0
          fi
          git commit -m "Daily data update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
